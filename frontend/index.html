<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapitalismus II</title>
    <meta name="description"
          content="Absolut originelle Wirtschaftssimulation bei der es um Leben und Tod geht. Irgendwann...">

    <meta property="og:title" content="">
    <meta property="og:type" content="">
    <meta property="og:url" content="">
    <meta property="og:image" content="">
    <meta property="og:image:alt" content="">
    <link rel="icon" href="./static/favicon/favicon.ico" sizes="any">

<style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #1a1a1a; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }

        /* Auth View */
        .auth-box { max-width: 400px; margin: 100px auto; background: #2a2a2a; padding: 20px; border-radius: 5px; border: 1px solid #333; }
        .form-group { margin-bottom: 15px; }
        .form-group input { width: 100%; padding: 8px; background: #1a1a1a; border: 1px solid #444; color: #fff; box-sizing: border-box; }
        button { padding: 10px; cursor: pointer; background-color: #eb720f; border: none; color: white; border-radius: 4px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        button:hover { background-color: #d6630a; }

        /* Game View Layout */
        #game-view { display: flex; flex-direction: column; height: 100%; width: 100%; }
        #top-bar-container { height: 60px; background-color: #111; border-bottom: 1px solid #333; display: flex; align-items: center; padding: 0 20px; z-index: 10; }

        .main-workspace { display: flex; flex: 1; overflow: hidden; }
        #left-panel-container { width: 250px; background-color: #222; border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        #content-area { flex: 1; padding: 20px; overflow-y: auto; position: relative; }

        /* Action Buttons */
        .action-btn { background-color: #4CAF50; margin-top: 5px; }
        .action-btn:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <div id="auth-view" class="auth-box">
        <h2 id="auth-title">Anmelden</h2>
        <div id="error-msg" style="color: #ff4d4d; margin-bottom: 15px;"></div>
        <div class="form-group"><input type="text" id="username" placeholder="Benutzername"></div>
        <div class="form-group"><input type="password" id="password" placeholder="Passwort"></div>
        <button id="submit-auth-btn">Einloggen</button>
        <button id="toggle-auth-btn" style="background-color: #444;">Konto erstellen</button>
    </div>

    <div id="game-view" class="hidden">
        <div id="top-bar-container">
            <top-bar id="top-bar-ui"></top-bar>
        </div>

        <div class="main-workspace">
            <div id="left-panel-container">
                <player-info id="player-info-ui"></player-info>

                <h4 style="border-bottom: 1px solid #444; padding-bottom: 5px; margin-top: 30px;">Navigation</h4>
                <button id="world-btn" style="background-color: #3498db;">Weltkarte</button>

                <h4 style="border-bottom: 1px solid #444; padding-bottom: 5px; margin-top: 20px;">Manuelle Arbeit</h4>
                <button class="action-btn" id="gather-wood-btn">Holz hacken</button>
                <button class="action-btn" id="gather-stone-btn" style="background-color: #7f8c8d;">Stein klopfen</button>

                <button id="logout-btn" style="background-color: #c0392b; margin-top: auto;">Ausloggen</button>
            </div>

            <div id="content-area">
                <overworld-map id="overworld-ui"></overworld-map>
                <sector-grid id="map-ui" class="hidden"></sector-grid>
            </div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
