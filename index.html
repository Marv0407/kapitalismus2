<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incremental Economy - Scoreboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .hidden {
            display: none !important;
        }
        .auth-box {
            max-width: 600px;
            margin: 50px auto 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            background-color: #eb720f;
            border: none;
            color: white;
            border-radius: 4px;
            font-weight: bold;
        }
        button:hover {
            background-color: #d6630a;
        }
        .btn-secondary {
            background-color: #444;
        }
        .btn-secondary:hover {
            background-color: #555;
        }
        #error-msg {
            color: #ff4d4d;
            margin-bottom: 15px;
        }

        /* Das Layout-Grid für die Spiel-Ansicht */
        .game-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div id="auth-view" class="auth-box">
            <h2 id="auth-title">Anmelden</h2>
            <div id="error-msg"></div>
            <div class="form-group">
                <label for="username">Benutzername</label>
                <input type="text" id="username">
            </div>
            <div class="form-group">
                <label for="password">Passwort</label>
                <input type="password" id="password">
            </div>
            <button id="submit-auth-btn">Einloggen</button>
            <button id="toggle-auth-btn" class="btn-secondary">Konto erstellen</button>
        </div>

        <div id="game-view" class="hidden">
            <div style="overflow: hidden;">
                <h1 style="float: left; margin: 0;">Wirtschaftssimulation</h1>
                <button id="logout-btn" class="btn-secondary" style="float: right;">Ausloggen</button>
            </div>

            <div class="game-layout">
                <div>
                    <resource-display id="economy-ui"></resource-display>
                    <button id="sell-btn" style="margin-top: 20px;">
                        10 Holz für 5 Gold an NPC verkaufen
                    </button>
                </div>

                <div>
                    <score-board id="scoreboard-ui"></score-board>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Web Component: Ressourcen-Anzeige
        class ResourceDisplay extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.shadowRoot.innerHTML = `
                    <style>
                        .panel { background: #2a2a2a; padding: 15px; border-radius: 5px; border: 1px solid #333; }
                        .stat { font-size: 18px; margin: 5px 0; }
                        .gold { color: #ffd700; }
                        .wood { color: #deb887; }
                    </style>
                    <div class="panel">
                        <div class="stat">Gold: <span class="gold" id="gold-val">0</span></div>
                        <div class="stat">Holz: <span class="wood" id="wood-val">0</span></div>
                    </div>
                `;
            }
            updateValues(gold, wood) {
                this.shadowRoot.getElementById('gold-val').textContent = gold;
                this.shadowRoot.getElementById('wood-val').textContent = wood;
            }
        }
        customElements.define('resource-display', ResourceDisplay);

        // NEUE Web Component: Scoreboard
        class ScoreBoard extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.shadowRoot.innerHTML = `
                    <style>
                        .panel { background: #222; padding: 15px; border-radius: 5px; border: 1px solid #333; }
                        h3 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 5px; color: #eb720f; }
                        .player-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #2a2a2a; font-size: 14px; }
                        .name-wrapper { display: flex; align-items: center; gap: 8px; }
                        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
                        .online { background-color: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
                        .offline { background-color: #95a5a6; }
                        .gold { color: #ffd700; font-weight: bold; }
                    </style>
                    <div class="panel">
                        <h3>Rangliste</h3>
                        <div id="rows-container"></div>
                    </div>
                `;
            }

            renderData(players) {
                const container = this.shadowRoot.getElementById('rows-container');
                container.innerHTML = '';

                players.forEach(p => {
                    const row = document.createElement('div');
                    row.className = 'player-row';
                    row.innerHTML = `
                        <div class="name-wrapper">
                            <span class="status-dot ${p.online ? 'online' : 'offline'}"></span>
                            <span>${p.username}</span>
                        </div>
                        <div class="gold">${p.gold} G</div>
                    `;
                    container.appendChild(row);
                });
            }
        }
        customElements.define('score-board', ScoreBoard);

        // UI-Elemente referenzieren
        const authView = document.getElementById('auth-view');
        const gameView = document.getElementById('game-view');
        const authTitle = document.getElementById('auth-title');
        const errorMsg = document.getElementById('error-msg');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitAuthBtn = document.getElementById('submit-auth-btn');
        const toggleAuthBtn = document.getElementById('toggle-auth-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const sellBtn = document.getElementById('sell-btn');
        const ui = document.getElementById('economy-ui');
        const scoreboardUi = document.getElementById('scoreboard-ui');

        let isLoginMode = true;
        let ws = null;

        toggleAuthBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            authTitle.textContent = isLoginMode ? 'Anmelden' : 'Registrieren';
            submitAuthBtn.textContent = isLoginMode ? 'Einloggen' : 'Konto erstellen';
            toggleAuthBtn.textContent = isLoginMode ? 'Konto erstellen' : 'Bereits registriert?';
            errorMsg.textContent = '';
        });

        submitAuthBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            errorMsg.textContent = '';

            if (!username || !password) {
                errorMsg.textContent = 'Bitte alle Felder ausfüllen.';
                return;
            }

            const endpoint = isLoginMode ? '/api/login' : '/api/register';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || 'Fehler.');

                localStorage.setItem('player_id', result.player_id);
                initGame();
            } catch (err) {
                errorMsg.textContent = err.message;
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('player_id');
            if (ws) ws.close();
            gameView.classList.add('hidden');
            authView.classList.remove('hidden');
        });

        function initGame() {
            const playerId = localStorage.getItem('player_id');
            if (!playerId) {
                authView.classList.remove('hidden');
                gameView.classList.add('hidden');
                return;
            }

            authView.classList.add('hidden');
            gameView.classList.remove('hidden');

            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws?player_id=${playerId}`);

            ws.onmessage = (event) => {
                const response = JSON.parse(event.data);

                if (response.type === 'resource_update') {
                    ui.updateValues(response.data.gold, response.data.wood);
                }
                else if (response.type === 'scoreboard_update') {
                    // Reiche die Rangliste an die Web Component weiter
                    scoreboardUi.renderData(response.data);
                }
            };

            ws.onclose = () => {
                console.log('Verbindung verloren.');
            };
        }

        sellBtn.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ action: 'sell_wood' }));
            }
        });

        initGame();
    </script>
</body>
</html>
